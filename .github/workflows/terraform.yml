name: Terraform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # 4. Validate Terraform code
      - name: Terraform Validate
        run: terraform validate

      # 5. Generate Terraform Plan
      - name: Terraform Plan
        run: terraform plan